# KruschStack Docker Compose Stack
# Note: `krusch-stack` executes runtime storage on Node 22 native `node:sqlite` (`/app/.krusch-stack/stack.db`),
# while `postgres` provisions the 21-table PostgreSQL 16 + `pgvector` companion schema from `db/init.sql`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: krusch-stack-postgres
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-krusch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-krusch_stack_local}
      POSTGRES_DB: ${POSTGRES_DB:-krusch_stack}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - krusch_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-krusch} -d $${POSTGRES_DB:-krusch_stack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  krusch-stack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krusch-stack
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      KRUSCH_STACK_HOST: 0.0.0.0
      KRUSCH_STACK_PORT: 3780
      KRUSCH_ALLOWED_HOSTS: ${KRUSCH_ALLOWED_HOSTS:-krusch-stack}
      KRUSCH_STACK_PROFILE: ${KRUSCH_STACK_PROFILE:-full}
      DB_PATH: /app/.krusch-stack/stack.db
      DATABASE_URL: postgresql://${POSTGRES_USER:-krusch}:${POSTGRES_PASSWORD:-krusch_stack_local}@postgres:5432/${POSTGRES_DB:-krusch_stack}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:${KRUSCH_STACK_PORT:-3780}:3780"
    volumes:
      - krusch_stack_data:/app/.krusch-stack
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3780/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  krusch_postgres_data:
  krusch_stack_data:
